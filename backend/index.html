<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        textarea {
            resize: vertical;
        }

        .error {
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen p-4">
    <div class="container mx-auto">
        <h1 class="text-4xl font-bold text-center mb-6">Admin Dashboard</h1>

        <!-- Error Message -->
        <div id="error" class="bg-red-100 text-red-700 p-4 mb-6 rounded text-center error"></div>

        <!-- Add Item Form -->
        <div class="bg-white p-6 rounded shadow mb-6">
            <h2 class="text-2xl font-bold mb-4">Thêm sản phẩm</h2>
            <form id="add-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Tên</label>
                    <input type="text" id="add-name" class="w-full p-2 border rounded" required>
                </div>
                <div>
                    <label class="block text-sm font-medium">Mô tả</label>
                    <textarea id="add-description" class="w-full p-2 border rounded" required></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium">Danh mục</label>
                    <select id="add-category" class="w-full p-2 border rounded">
                        <option value="">Chọn danh mục</option>
                        <option value="Piston">Piston</option>
                        <option value="Rings">Rings</option>
                        <option value="Valves">Valves</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium">Tên hình (không bắt buộc)</label>
                    <input type="text" id="add-imageName" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium">File hình</label>
                    <input type="file" id="add-imageFile" name="imageFile" accept="image/*" class="w-full p-2">
                </div>
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Thêm
                    Sản phẩm</button>
            </form>
        </div>

        <!-- Items Table -->
        <div class="bg-white rounded shadow overflow-x-auto">
            <h2 class="text-2xl font-bold p-4">Sản phẩm</h2>
            <div id="loading" class="text-center p-4">Loading items...</div>
            <table id="items-table" class="w-full hidden">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="p-2 text-left">ID</th>
                        <th class="p-2 text-left">Tên</th>
                        <th class="p-2 text-left">Mô tả</th>
                        <th class="p-2 text-left">Danh mục</th>
                        <th class="p-2 text-left">Hình</th>
                        <th class="p-2 text-left">Hành động</th>
                    </tr>
                </thead>
                <tbody id="items-body"></tbody>
            </table>
            <p id="no-items" class="text-center p-4 hidden">No items available</p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/items';

        // Show error
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 5000);
        }

        // Fetch and display items
        function fetchItems() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('items-table').classList.add('hidden');
            document.getElementById('no-items').classList.add('hidden');

            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    if (data.result === 'error') {
                        showError(data.errors[0].details);
                        document.getElementById('no-items').classList.remove('hidden');
                        return;
                    }
                    const items = data.data;
                    const tbody = document.getElementById('items-body');
                    tbody.innerHTML = '';
                    if (items.length === 0) {
                        document.getElementById('no-items').classList.remove('hidden');
                    } else {
                        document.getElementById('items-table').classList.remove('hidden');
                        items.forEach(item => {
                            const tr = document.createElement('tr');
                            tr.className = 'border-t';
                            tr.innerHTML = `
                                <td class="p-2">${item.id}</td>
                                <td class="p-2" id="name-${item.id}">${item.name}</td>
                                <td class="p-2" id="desc-${item.id}">${item.description}</td>
                                <td class="p-2">${item.category || 'N/A'}</td>
                                <td class="p-2">
                                    <img src="${item.image}" alt="${item.name}" class="h-16 w-16 object-cover rounded"
                                         onerror="this.src='https://via.placeholder.com/64'">
                                </td>
                                <td class="p-2 flex space-x-2">
                                    <button onclick="startEditing(${item.id})" class="bg-yellow-500 text-white px-2 py-1 rounded hover:bg-yellow-600">Chỉnh</button>
                                    <button onclick="deleteItem(${item.id})" class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600">Xóa</button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                })
                .catch(() => {
                    document.getElementById('loading').style.display = 'none';
                    showError('Failed to fetch items');
                    document.getElementById('no-items').classList.remove('hidden');
                });
        }

        // Add item
        document.getElementById('add-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('add-name').value;
            const description = document.getElementById('add-description').value;
            const category = document.getElementById('add-category').value;
            const imageName = document.getElementById('add-imageName').value;
            const imageFile = document.getElementById('add-imageFile').files[0];

            const formData = new FormData();
            formData.append('name', name);
            formData.append('description', description);
            if (category) formData.append('category', category);
            if (imageFile) {
                const extension = imageFile.name.split('.').pop();
                const image = imageName ? `${imageName}.${extension}` : imageFile.name;
                formData.append('image', image);
                formData.append('imageFile', imageFile);
            }

            fetch(API_URL, {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    if (data.result === 'error') {
                        showError(data.errors[0].details);
                        return;
                    }
                    const item = data.newItem;
                    if (!item || !item.id) {
                        showError('Failed to add item: Invalid response');
                        return;
                    }
                    document.getElementById('add-form').reset();
                    fetchItems();
                })
                .catch(() => showError('Failed to add item'));
        });

        // Start editing
        function startEditing(id) {
            const nameCell = document.getElementById(`name-${id}`);
            const descCell = document.getElementById(`desc-${id}`);
            const catCell = nameCell.parentElement.querySelector('td:nth-child(4)');
            const name = nameCell.textContent;
            const description = descCell.textContent;
            const category = catCell.textContent;

            nameCell.innerHTML = `<input id="edit-name-${id}" value="${name}" class="w-full p-1 border rounded">`;
            descCell.innerHTML = `<textarea id="edit-desc-${id}" class="w-full p-1 border rounded">${description}</textarea>`;
            catCell.innerHTML = `
                <select id="edit-category-${id}" class="w-full p-1 border rounded">
                    <option value="">Chọn danh mục</option>
                    <option value="Piston" ${category === 'Piston' ? 'selected' : ''}>Piston</option>
                    <option value="Rings" ${category === 'Rings' ? 'selected' : ''}>Rings</option>
                    <option value="Valves" ${category === 'Valves' ? 'selected' : ''}>Valves</option>
                </select>
            `;

            const actionCell = nameCell.parentElement.querySelector('td:last-child');
            actionCell.innerHTML = `
                <button onclick="saveEdit(${id})" class="bg-green-500 text-white px-2 py-1 rounded hover:bg-green-600">Save</button>
                <button onclick="fetchItems()" class="bg-gray-500 text-white px-2 py-1 rounded hover:bg-gray-600">Cancel</button>
                <button onclick="deleteItem(${id})" class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600">Delete</button>
            `;
        }

        // Save edit
        function saveEdit(id) {
            const name = document.getElementById(`edit-name-${id}`).value;
            const description = document.getElementById(`edit-desc-${id}`).value;
            const category = document.getElementById(`edit-category-${id}`).value;
            const imageName = document.getElementById('add-imageName').value;
            const imageFile = document.getElementById('add-imageFile').files[0];

            const formData = new FormData();
            formData.append('name', name);
            formData.append('description', description);
            if (category) formData.append('category', category);
            if (imageFile) {
                const extension = imageFile.name.split('.').pop();
                const image = imageName ? `${imageName}.${extension}` : imageFile.name;
                formData.append('image', image);
                formData.append('imageFile', imageFile);
            } else if (imageName) {
                formData.append('image', imageName);
            }

            fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    if (data.result === 'error') {
                        showError(data.errors[0].details);
                        return;
                    }
                    const item = data.updatedItem;
                    if (!item || !item.id) {
                        showError('Failed to update item: Invalid response');
                        return;
                    }
                    fetchItems();
                })
                .catch(() => showError('Failed to update item'));
        }

        // Delete item
        function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            })
                .then(res => {
                    if (!res.ok) throw new Error('Failed to delete');
                    fetchItems();
                })
                .catch(() => showError('Failed to delete item'));
        }

        // Initial fetch
        fetchItems();
    </script>
</body>

</html>
